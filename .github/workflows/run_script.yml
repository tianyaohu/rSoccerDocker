name: execute python scripts in test on push

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install ruff linter
        run: pip install ruff
      - name: run ruff check
        run: ruff check --output-format=github .

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t rsoccer:latest .

      - name: run all test scripts
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PYTHONPATH=/workspace/src \
            -e WANDB_MODE=offline \
            rsoccer:latest \
            /bin/bash -c "for file in test/*.py; do echo 'executing $file...'; micromamba run -n rsoccer310 python \$file; done"
